<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ed"><title>DAY FIVE — GO. AGAIN.</title>
<style>
:root{--bg:#f7f4ed;--panel:#fff;--text:#202124;--muted:#77746d;--green:#2f7d4a;--soft:#e8f3ec;--orange:#e76f2e;--line:#dedbd3}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input{font:inherit}.app{max-width:520px;margin:auto;padding:22px 18px 110px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.11em;font-size:20px}.tag{font-size:12px;color:var(--orange);letter-spacing:.12em;margin-top:4px;font-weight:800}.cycle{font-size:12px;color:var(--muted);text-align:right}.hero{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#fff,#f1eee7);padding:24px 20px 22px;display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center;box-shadow:0 12px 34px rgba(35,32,25,.08)}.ring{--p:20;width:124px;height:124px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#e2dfd7 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}.ringtext{position:relative;z-index:1;text-align:center}.big{font-size:34px;font-weight:900;line-height:1}.small{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.08em}.hero h1{font-size:28px;line-height:1.05;margin:0 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.35}.next{margin:24px 2px 10px;font-size:12px;color:var(--green);letter-spacing:.14em;font-weight:800}.day{border:1px solid var(--line);background:var(--panel);border-radius:22px;margin:12px 0;overflow:hidden;box-shadow:0 4px 16px rgba(35,32,25,.035)}.day.completed{border-color:#a9d2b7;background:#fbfdfb}.dayhead{padding:17px;display:flex;gap:14px;align-items:center;cursor:pointer}.num{width:42px;height:42px;min-width:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #c9c6be;font-weight:900;font-size:18px}.completed .num{background:var(--green);color:#fff;border-color:var(--green)}.daytitle{flex:1}.daytitle b{display:block;font-size:17px}.daytitle span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.chev{color:var(--muted);font-size:18px}.details{display:none;padding:0 17px 17px}.day.open .details{display:block}.exercise{border-top:1px solid var(--line)}.exmain{display:flex;align-items:center;gap:12px;padding:12px 0}.check{width:25px;height:25px;min-width:25px;border-radius:8px;border:1px solid #c9c6be;background:#faf8f3;display:grid;place-items:center;color:#fff;font-weight:900;cursor:pointer}.check.on{background:var(--green);border-color:var(--green)}.extext{font-size:15px;line-height:1.35;flex:1}.extext small{display:block;color:var(--muted);margin-top:2px}.weightsToggle{border:1px solid var(--line);background:#faf8f3;border-radius:10px;padding:7px 9px;color:var(--green);font-size:12px;font-weight:800;cursor:pointer}.sets{display:none;padding:0 0 12px 37px}.exercise.weights-open .sets{display:block}.setrow{display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:8px;margin:7px 0}.setlabel{font-size:12px;color:var(--muted);font-weight:700}.weightwrap{display:flex;align-items:center;background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:0 9px}.weight{width:100%;border:0;outline:0;background:transparent;padding:9px 0;font-size:15px;color:var(--text)}.kg{font-size:12px;color:var(--muted)}.removeSet{border:0;background:transparent;color:var(--muted);font-size:20px;padding:0;cursor:pointer}.addset{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:800;padding:5px 0;cursor:pointer}.previous{font-size:11px;color:var(--muted);margin-top:5px}.note{border-top:1px solid var(--line);padding:12px 0 2px;color:var(--muted);font-size:13px;line-height:1.4}.completebtn{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--green);color:#fff;padding:15px 14px;font-weight:900;font-size:15px}.completebtn.done{background:var(--soft);color:var(--green);border:1px solid #b9d8c4}.footerline{text-align:center;color:var(--muted);margin-top:24px;font-size:13px}.quote{text-align:center;margin:8px 0 0;font-weight:800;letter-spacing:.05em}.resetbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(247,244,237,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line)}.resetinner{max-width:520px;margin:auto;display:flex;gap:10px}.ghost,.goagain{flex:1;border-radius:14px;padding:14px;border:1px solid #d0ccc3;background:#fff;color:var(--text);font-weight:800}.goagain{background:var(--orange);color:#fff;border-color:var(--orange)}.celebrate{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;place-items:center;padding:28px;text-align:center}.celebrate.show{display:grid}.five{font-size:150px;line-height:.8;font-weight:1000;color:var(--green);letter-spacing:-.08em}.celebrate h2{font-size:38px;margin:22px 0 8px}.celebrate p{color:var(--muted);max-width:340px;margin:0 auto 26px;line-height:1.45}.celebrate button{border:0;border-radius:16px;background:var(--orange);color:#fff;padding:16px 26px;font-size:17px;font-weight:900}.mini{font-size:11px;color:var(--muted);margin-top:12px}@media(max-width:390px){.hero{grid-template-columns:110px 1fr}.ring{width:104px;height:104px}.hero h1{font-size:24px}}
</style></head><body>
<div class="app"><div class="top"><div><div class="brand">DAY FIVE.</div><div class="tag">GO. AGAIN.</div></div><div class="cycle" id="cycleLabel"></div></div><section class="hero"><div class="ring" id="ring"><div class="ringtext"><div class="big"><span id="doneCount"></span>/5</div><div class="small">COMPLETE</div></div></div><div><h1 id="heroTitle"></h1><p id="heroCopy"></p></div></section><div class="next">YOUR FIVE</div><div id="days"></div><div class="quote">DAY FIVE. GO. AGAIN.</div><div class="footerline">No missed days. No broken streaks. Just the next one.</div></div>
<div class="resetbar"><div class="resetinner"><button class="ghost" id="undoBtn">Undo last</button><button class="goagain" id="goAgainBtn">GO AGAIN →</button></div></div><div class="celebrate" id="celebrate"><div><div class="five">5</div><h2>YOU GOT THERE.</h2><p>Five complete. No deadline. No streak to protect. When you're ready, go again.</p><button id="celebrateGo">GO AGAIN →</button><div class="mini">Your completed cycle stays in the history count.</div></div></div>
<script>
const plan=[{title:"Legs",subtitle:"Day 1",exercises:[["Bike","5 min warm-up"],["Hip thrusts / lunges","4 × 10"],["Squats / leg press","4 × 10"],["Hamstring curls","3 × 10"],["Leg extensions","3 × 10"],["Calves","3 × 10"]],note:"No treadmill the day before or day after legs. Bike instead of a run."},{title:"Shoulders",subtitle:"Day 2",exercises:[["Press",""],["Side raise",""],["Rear fly",""],["Front raise",""],["Shrug — machine",""]]},{title:"Back + Biceps",subtitle:"Day 3",exercises:[["Wide row",""],["Narrow row / one-arm row",""],["Lat pull-down",""],["Lower back","Hip hinge or hyperextension chair/machine"],["Pole twists",""]]},{title:"Chest + Triceps",subtitle:"Day 4",exercises:[["Bench press",""],["Incline press",""],["Fly",""],["Pull-over",""],["Dips to bench",""],["Overhead / skulls",""],["Push-downs / rope",""]]},{title:"Back + Biceps",subtitle:"Day 5",exercises:[["Dumbbell curls",""],["Narrow preacher bench",""]]}];
const KEY="dayFiveStateV3";
function inferredSets(detail){const m=(detail||"").match(/(\d+)\s*[×xX]/);return m?+m[1]:3}
function blankWeights(){return plan.map(d=>d.exercises.map(e=>Array(inferredSets(e[1])).fill("")))}
function defaultState(){return{cycle:1,completed:[true,false,false,false,false],ex:plan.map(d=>d.exercises.map(()=>false)),history:0,opened:1,weights:blankWeights(),previousWeights:blankWeights(),weightOpen:null}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch(e){state=defaultState()}
if(!Array.isArray(state.completed))state.completed=[true,false,false,false,false];if(!Array.isArray(state.ex))state.ex=plan.map(d=>d.exercises.map(()=>false));plan.forEach((d,di)=>{if(!Array.isArray(state.ex[di])||state.ex[di].length!==d.exercises.length)state.ex[di]=d.exercises.map(()=>false)});if(!Array.isArray(state.weights))state.weights=blankWeights();if(!Array.isArray(state.previousWeights))state.previousWeights=blankWeights();plan.forEach((d,di)=>d.exercises.forEach((e,ei)=>{if(!Array.isArray(state.weights[di]))state.weights[di]=[];if(!Array.isArray(state.weights[di][ei]))state.weights[di][ei]=Array(inferredSets(e[1])).fill("");if(!Array.isArray(state.previousWeights[di]))state.previousWeights[di]=[];if(!Array.isArray(state.previousWeights[di][ei]))state.previousWeights[di][ei]=[]}));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){const done=state.completed.filter(Boolean).length;doneCount.textContent=done;ring.style.setProperty("--p",done*20);cycleLabel.textContent=`Cycle ${state.cycle}`;if(done===5){heroTitle.textContent="5/5.";heroCopy.textContent="Goal complete. Go again when you're ready."}else{const r=5-done,n=state.completed.findIndex(x=>!x);heroTitle.textContent=r===1?"One to go.":`${r} to go.`;heroCopy.textContent=`Next up: Day ${n+1} — ${plan[n].title}.`}
 days.innerHTML="";plan.forEach((d,di)=>{const day=document.createElement("section"),next=state.completed.findIndex(x=>!x);day.className="day"+(state.completed[di]?" completed":"")+(state.opened===di?" open":"");day.innerHTML=`<div class="dayhead"><div class="num">${state.completed[di]?"✓":di+1}</div><div class="daytitle"><b>${d.subtitle} — ${d.title}</b><span>${state.completed[di]?"Complete":di===next?"Next up":"Ready when you are"}</span></div><div class="chev">⌄</div></div><div class="details">${d.exercises.map((e,ei)=>{const key=`${di}-${ei}`,open=state.weightOpen===key,prev=(state.previousWeights[di][ei]||[]).filter(Boolean);return `<div class="exercise ${open?"weights-open":""}"><div class="exmain"><div class="check ${state.ex[di][ei]?"on":""}" data-check="${key}">${state.ex[di][ei]?"✓":""}</div><div class="extext">${esc(e[0])}${e[1]?`<small>${esc(e[1])}</small>`:""}</div><button class="weightsToggle" data-toggle="${key}">${open?"Hide":"Weight"}</button></div><div class="sets">${state.weights[di][ei].map((w,si)=>`<div class="setrow"><span class="setlabel">Set ${si+1}</span><div class="weightwrap"><input class="weight" inputmode="decimal" type="number" min="0" step="0.5" placeholder="—" value="${esc(w)}" data-weight="${di}-${ei}-${si}"><span class="kg">kg</span></div><button class="removeSet" data-remove="${di}-${ei}-${si}" aria-label="Remove set">×</button></div>`).join("")}<button class="addset" data-add="${key}">+ Add set</button>${prev.length?`<div class="previous">Previous cycle: ${prev.map(x=>esc(x)+" kg").join(" · ")}</div>`:""}</div></div>`}).join("")}${d.note?`<div class="note">${esc(d.note)}</div>`:""}<button class="completebtn ${state.completed[di]?"done":""}" data-complete="${di}">${state.completed[di]?"Completed ✓":"Mark Day Complete"}</button></div>`;day.querySelector(".dayhead").onclick=()=>{state.opened=state.opened===di?-1:di;save();render()};days.appendChild(day)});
 document.querySelectorAll("[data-check]").forEach(el=>el.onclick=()=>{const[di,ei]=el.dataset.check.split("-").map(Number);state.ex[di][ei]=!state.ex[di][ei];save();render()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{state.weightOpen=state.weightOpen===b.dataset.toggle?null:b.dataset.toggle;save();render()});document.querySelectorAll("[data-weight]").forEach(inp=>{inp.oninput=()=>{const[di,ei,si]=inp.dataset.weight.split("-").map(Number);state.weights[di][ei][si]=inp.value;save()}});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const[di,ei]=b.dataset.add.split("-").map(Number);state.weights[di][ei].push("");save();render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const[di,ei,si]=b.dataset.remove.split("-").map(Number);if(state.weights[di][ei].length>1)state.weights[di][ei].splice(si,1);else state.weights[di][ei][0]="";save();render()});document.querySelectorAll("[data-complete]").forEach(btn=>btn.onclick=()=>{const di=+btn.dataset.complete;state.completed[di]=!state.completed[di];if(state.completed[di]){state.opened=state.completed.findIndex(x=>!x);if(state.opened<0){state.history=(state.history||0)+1;celebrate.classList.add("show")}}else state.opened=di;save();render()})}
function newCycle(){state.previousWeights=JSON.parse(JSON.stringify(state.weights));state.weights=state.weights.map(day=>day.map(sets=>sets.map(()=>"")));state.cycle+=1;state.completed=[false,false,false,false,false];state.ex=plan.map(d=>d.exercises.map(()=>false));state.opened=0;state.weightOpen=null;save();celebrate.classList.remove("show");render()}goAgainBtn.onclick=()=>{if(state.completed.every(Boolean))newCycle();else{const n=state.completed.findIndex(x=>!x);state.opened=n<0?0:n;save();render();document.querySelectorAll(".day")[state.opened]?.scrollIntoView({behavior:"smooth",block:"center"})}};celebrateGo.onclick=newCycle;undoBtn.onclick=()=>{for(let i=4;i>=0;i--)if(state.completed[i]){state.completed[i]=false;state.opened=i;save();render();return}};render();
</script></body></html>
