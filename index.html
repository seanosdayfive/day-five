<style>

order-radius:10px;padding:0 9px}.rep,.weight{width:100%;border:0;outline:0;background:transparent;padding:9px 0;font-size:15px;color:#12324a}.unit{font-size:11px;color:#12324a;margin-left:4px}.kg{font-size:12px;color:#12324a}.removeSet{border:0;background:transparent;color:var(--muted);font-size:20px;padding:0;cursor:pointer}.addset{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:800;padding:5px 0;cursor:pointer}.previous{font-size:11px;color:var(--muted);margin-top:5px}.note{border-top:1px solid var(--line);padding:12px 0 2px;color:var(--muted);font-size:13px;line-height:1.4}.completebtn{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--green);color:#fff;padding:15px 14px;font-weight:900;font-size:15px}.completebtn.done{background:var(--soft);color:var(--green);border:1px solid #b9d8c4}.footerline{text-align:center;color:var(--muted);margin-top:24px;font-size:13px}.quote{text-align:center;margin:8px 0 0;font-weight:800;letter-spacing:.05em}.resetbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(7,18,27,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line)}.resetinner{max-width:520px;margin:auto;display:flex;gap:10px}.ghost,.goagain{flex:1;border-radius:14px;padding:14px;border:1px solid var(--line);background:#0d1c27;color:var(--text);font-weight:800}.goagain{background:var(--orange);color:#fff;border-color:var(--orange)}.celebrate{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;place-items:center;padding:28px;text-align:center}.celebrate.show{display:grid}.five{font-size:150px;line-height:.8;font-weight:1000;color:var(--green);letter-spacing:-.08em}.celebrate h2{font-size:38px;margin:22px 0 8px}.celebrate p{color:var(--muted);max-width:340px;margin:0 auto 26px;line-height:1.45}.celebrate button{border:0;border-radius:16px;background:var(--orange);color:#fff;padding:16px 26px;font-size:17px;font-weight:900}.mini{font-size:11px;color:var(--muted);margin-top:12px}@media(max-width:390px){.hero{grid-template-columns:110px 1fr}.ring{width:104px;height:104px}.hero h1{font-size:24px}}
</style></head><body>
<div class="app"><div class="top"><div><div class="brand">DAY FIVE.</div><div class="tag">GO. AGAIN.</div></div><div class="cycle" id="cycleLabel"></div></div><section class="hero"><div class="ring" id="ring"><div class="ringtext"><div class="big"><span id="doneCount"></span>/5</div><div class="small">COMPLETE</div></div></div><div><h1 id="heroTitle"></h1><p id="heroCopy"></p></div></section><div class="next">YOUR FIVE</div><div id="days"></div><div class="quote">DAY FIVE. GO. AGAIN.</div><div class="footerline">No missed days. No broken streaks. Just the next one.</div></div>
<div class="resetbar"><div class="resetinner"><button class="ghost" id="undoBtn">Undo last</button><button class="goagain" id="goAgainBtn">GO AGAIN →</button></div></div><div class="celebrate" id="celebrate"><div><div class="five">5</div><h2>YOU GOT THERE.</h2><p>Five complete. No deadline. No streak to protect. When you're ready, go again.</p><button id="celebrateGo">GO AGAIN →</button><div class="mini">Your completed cycle stays in the history count.</div></div></div>
<script>
const plan=[{title:"Legs",subtitle:"Day 1",exercises:[["Bike","5 min warm-up"],["Hip thrusts / lunges","4 × 10"],["Squats / leg press","4 × 10"],["Hamstring curls","3 × 10"],["Leg extensions","3 × 10"],["Calves","3 × 10"]],note:"No treadmill the day before or day after legs. Bike instead of a run."},{title:"Shoulders",subtitle:"Day 2",exercises:[["Press",""],["Side raise",""],["Rear fly",""],["Front raise",""],["Shrug — machine",""]]},{title:"Back + Biceps",subtitle:"Day 3",exercises:[["Wide row",""],["Narrow row / one-arm row",""],["Lat pull-down",""],["Lower back","Hip hinge or hyperextension chair/machine"],["Pole twists",""]]},{title:"Chest + Triceps",subtitle:"Day 4",exercises:[["Bench press",""],["Incline press",""],["Fly",""],["Pull-over",""],["Dips to bench",""],["Overhead / skulls",""],["Push-downs / rope",""]]},{title:"Back + Biceps",subtitle:"Day 5",exercises:[["Dumbbell curls",""],["Narrow preacher bench",""]]}];
const KEY="dayFiveStateV3";
const exerciseLibraries=[
["Bike","Hip thrusts / lunges","Squats / leg press","Goblet squat","Front squat","Leg press","Walking lunges","Bulgarian split squat","Romanian deadlift","Hamstring curls","Leg extensions","Calves","Standing calf raise","Seated calf raise"],
["Press","Dumbbell shoulder press","Barbell shoulder press","Arnold press","Side raise","Lateral raise","Rear fly","Rear delt fly","Front raise","Upright row","Face pull","Overhead press","Landmine press","Push press","Shrug — machine"],
["Wide row","Narrow row / one-arm row","Seated cable row","Chest-supported row","Lat pull-down","Pull-up","Assisted pull-up","Straight-arm pull-down","Lower back","Hyperextension","Hip hinge","Pole twists","Dumbbell curls","Hammer curls","Cable curls","Preacher curls"],
["Bench press","Dumbbell bench press","Incline press","Incline dumbbell press","Chest press — machine","Fly","Cable fly","Pec deck","Push-up","Pull-over","Dips to bench","Triceps dips","Overhead / skulls","Skull crushers","Push-downs / rope","Triceps push-down"],
["Dumbbell curls","Hammer curls","Cable curls","Barbell curls","EZ-bar curls","Narrow preacher bench","Preacher curls","Wide row","Narrow row / one-arm row","Seated cable row","Lat pull-down","Pull-up","Assisted pull-up","Face pull"]
];
function defaultExerciseNames(){return plan.map(d=>d.exercises.map(e=>e[0]))}
function inferredSets(detail){const m=(detail||"").match(/(\d+)\s*[×xX]/);return m?+m[1]:3}
function inferredReps(detail){const m=(detail||"").match(/\d+\s*[×xX]\s*(\d+)/);return m?m[1]:""}
function blankWeights(){return plan.map(d=>d.exercises.map(e=>Array(inferredSets(e[1])).fill("")))}
function blankReps(){return plan.map(d=>d.exercises.map(e=>Array(inferredSets(e[1])).fill(inferredReps(e[1]))))}
function defaultState(){return{cycle:1,completed:[true,false,false,false,false],ex:plan.map(d=>d.exercises.map(()=>false)),history:0,opened:1,weights:blankWeights(),previousWeights:blankWeights(),weightOpen:null,reps:blankReps(),previousReps:blankReps(),repMemory:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch(e){state=defaultState()}
if(!Array.isArray(state.reps))state.reps=blankReps();if(!Array.isArray(state.previousReps))state.previousReps=blankReps();if(!state.repMemory||typeof state.repMemory!=="object")state.repMemory={};if(!Array.isArray(state.exerciseNames))state.exerciseNames=defaultExerciseNames();if(!state.weightMemory||typeof state.weightMemory!=="object")state.weightMemory={};if(!Array.isArray(state.completed))state.completed=[true,false,false,false,false];if(!Array.isArray(state.ex))state.ex=plan.map(d=>d.exercises.map(()=>false));plan.forEach((d,di)=>{if(!Array.isArray(state.ex[di])||state.ex[di].length!==d.exercises.length)state.ex[di]=d.exercises.map(()=>false)});if(!Array.isArray(state.weights))state.weights=blankWeights();if(!Array.isArray(state.previousWeights))state.previousWeights=blankWeights();plan.forEach((d,di)=>d.exercises.forEach((e,ei)=>{if(!Array.isArray(state.weights[di]))state.weights[di]=[];if(!Array.isArray(state.weights[di][ei]))state.weights[di][ei]=Array(inferredSets(e[1])).fill("");if(!Array.isArray(state.previousWeights[di]))state.previousWeights[di]=[];if(!Array.isArray(state.previousWeights[di][ei]))state.previousWeights[di][ei]=[];if(!Array.isArray(state.reps[di]))state.reps[di]=[];if(!Array.isArray(state.reps[di][ei]))state.reps[di][ei]=Array(state.weights[di][ei].length).fill(inferredReps(e[1]));if(!Array.isArray(state.previousReps[di]))state.previousReps[di]=[];if(!Array.isArray(state.previousReps[di][ei]))state.previousReps[di][ei]=[]}));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function currentName(di,ei){return state.exerciseNames?.[di]?.[ei]||plan[di].exercises[ei][0]}
function rememberCurrent(di,ei){const n=currentName(di,ei);if(n){state.weightMemory[n]=JSON.parse(JSON.stringify(state.weights[di][ei]||[]));state.repMemory[n]=JSON.parse(JSON.stringify(state.reps[di][ei]||[]))}}
function loadExercise(di,ei,name){rememberCurrent(di,ei);if(!state.exerciseNames[di])state.exerciseNames[di]=[];state.exerciseNames[di][ei]=name;const remembered=state.weightMemory[name];state.weights[di][ei]=remembered?JSON.parse(JSON.stringify(remembered)):Array(inferredSets(plan[di].exercises[ei][1])).fill("");state.previousWeights[di][ei]=remembered?JSON.parse(JSON.stringify(remembered)):[];const rememberedReps=state.repMemory[name];state.reps[di][ei]=rememberedReps?JSON.parse(JSON.stringify(rememberedReps)):Array(state.weights[di][ei].length).fill("");state.previousReps[di][ei]=rememberedReps?JSON.parse(JSON.stringify(rememberedReps)):[];state.ex[di][ei]=false;save()}function exerciseGuide(name){
 const n=name.toLowerCase();
 let equipment="Gym equipment varies — match the movement to the machine or free-weight option available.";
 let icon="🏋️";
 let how="Use a controlled range of motion, keep the working joints aligned and choose a load you can control.";
 if(n.includes("bike")){equipment="Stationary exercise bike.";icon="🚴";how="Adjust the seat so the knee stays slightly bent at the bottom of the pedal stroke. Pedal smoothly at an easy warm-up pace."}
 else if(n.includes("press")&&n.includes("leg")){equipment="Leg press machine.";icon="🦵";how="Set your feet securely on the platform, keep your back supported, lower under control and press without locking the knees."}
 else if(n.includes("shoulder")||n==="press"||n.includes("overhead press")){equipment="Shoulder press machine or dumbbells, depending on the selected exercise.";icon="🏋️";how="Set the seat so the handles begin around shoulder height. Brace your torso, press smoothly overhead and lower under control."}
 else if(n.includes("raise")){equipment=n.includes("machine")?"Lateral/rear-delt machine.":"Dumbbells or cable station.";icon="🙆";how="Use a light controllable load. Raise without swinging, keep the shoulder relaxed away from the ear, then lower slowly."}
 else if(n.includes("row")){equipment=n.includes("cable")?"Seated cable row machine.":"Row machine, cable station or dumbbell depending on the variation.";icon="🚣";how="Keep your torso stable, pull the handle toward you by driving the elbow back, pause briefly and return under control."}
 else if(n.includes("pull-down")||n.includes("pulldown")){equipment="Lat pull-down cable machine.";icon="⬇️";how="Set the thigh pad securely, grip the bar, keep your chest tall and pull toward the upper chest without jerking."}
 else if(n.includes("curl")){equipment=n.includes("preacher")?"Preacher bench with dumbbell/EZ bar or preacher machine.":"Dumbbells, barbell or cable station depending on the variation.";icon="💪";how="Keep the upper arm controlled, curl through a comfortable range and lower slowly without swinging."}
 else if(n.includes("bench")||n.includes("chest press")){equipment="Flat bench with barbell/dumbbells, or chest press machine.";icon="🏋️";how="Set your shoulders securely, keep feet planted, lower the weight under control and press smoothly."}
 else if(n.includes("fly")||n.includes("pec")){equipment="Pec-deck machine, cables or dumbbells depending on the variation.";icon="🪽";how="Keep a soft bend in the elbows, bring the arms together under control and return without overstretching the shoulder."}
 else if(n.includes("hamstring")){equipment="Seated or lying hamstring curl machine.";icon="🦵";how="Align the machine pivot with the knee, secure the pad, curl smoothly and return slowly."}
 else if(n.includes("extension")){equipment="Leg extension machine.";icon="🦵";how="Align your knee with the machine pivot, extend smoothly without snapping the knee straight, then lower under control."}
 else if(n.includes("calf")){equipment="Calf raise machine, leg press, or stable step with load.";icon="🦶";how="Move through a comfortable ankle range, rise onto the ball of the foot, pause, then lower under control."}
 else if(n.includes("squat")||n.includes("lunge")||n.includes("split squat")){equipment="Rack/barbell, dumbbells or bodyweight depending on the selected variation.";icon="🦵";how="Keep the foot planted and knee tracking with the foot. Move through a comfortable depth while keeping the load controlled."}
 else if(n.includes("hip thrust")){equipment="Bench plus barbell/pad, or hip-thrust machine.";icon="🦵";how="Set the upper back securely, keep feet planted and drive the hips up under control without overextending the lower back."}
 else if(n.includes("hyper")||n.includes("lower back")||n.includes("hip hinge")){equipment="Hyperextension chair or free weights for a hip-hinge variation.";icon="↕️";how="Hinge from the hips with a braced torso and neutral spine. Move only through a comfortable controlled range."}
 else if(n.includes("push-down")||n.includes("pushdown")){equipment="Cable station with rope or bar attachment.";icon="💪";how="Keep elbows close to the body, extend the elbows smoothly and return without letting the shoulders roll forward."}
 return {equipment,icon,how};
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){const done=state.completed.filter(Boolean).length;doneCount.textContent=done;ring.style.setProperty("--p",done*20);cycleLabel.textContent=`Cycle ${state.cycle}`;if(done===5){heroTitle.textContent="5/5.";heroCopy.textContent="Goal complete. Go again when you're ready."}else{const r=5-done,n=state.completed.findIndex(x=>!x);heroTitle.textContent=r===1?"One to go.":`${r} to go.`;heroCopy.textContent=`Next up: Day ${n+1} — ${plan[n].title}.`}
 days.innerHTML="";plan.forEach((d,di)=>{const day=document.createElement("section"),next=state.completed.findIndex(x=>!x);day.className="day"+(state.completed[di]?" completed":"")+(state.opened===di?" open":"");day.innerHTML=`<div class="dayhead"><div class="num">${state.completed[di]?"✓":di+1}</div><div class="daytitle"><b>${d.subtitle} — ${d.title}</b><span>${state.completed[di]?"Complete":di===next?"Next up":"Ready when you are"}</span></div><div class="chev">⌄</div></div><div class="details">${d.exercises.map((e,ei)=>{const key=`${di}-${ei}`,open=state.weightOpen===key,prev=(state.previousWeights[di][ei]||[]).filter(Boolean);const guideOpen=state.guideOpen===key,g=exerciseGuide(currentName(di,ei));return `<div class="exercise ${open?"weights-open":""} ${guideOpen?"guide-open":""}"><div class="exmain"><div class="check ${state.ex[di][ei]?"on":""}" data-check="${key}">${state.ex[di][ei]?"✓":""}</div><div class="extext"><select class="exerciseSelect" data-exercise="${key}">${[...new Set([currentName(di,ei),...(exerciseLibraries[di]||[])])].map(n=>`<option value="${esc(n)}" ${n===currentName(di,ei)?"selected":""}>${esc(n)}</option>`).join("")}<option value="__custom__">+ Custom exercise…</option></select>${e[1]?`<small>${esc(e[1])}</small>`:""}</div><button class="learn" data-guide="${key}" aria-label="How to do this exercise">ⓘ</button><button class="weightsToggle" data-toggle="${key}">${open?"Hide":"Log"}</button></div><div class="guide"><div class="guideIcon">${g.icon}</div><h3>${esc(currentName(di,ei))}</h3><p><b>Equipment</b><br>${esc(g.equipment)}</p><p><b>How to do it</b><br>${esc(g.how)}</p><p>Start light and use a comfortable, controlled range. If an exercise causes pain, stop and get guidance from a qualified trainer or health professional.</p></div><div class="sets">${state.weights[di][ei].map((w,si)=>`<div class="setrow"><span class="setlabel">Set ${si+1}</span><div class="repwrap"><input class="rep" inputmode="numeric" type="number" min="0" step="1" placeholder="—" value="${esc(state.reps[di][ei][si]??"")}" data-rep="${di}-${ei}-${si}"><span class="unit">reps</span></div><div class="weightwrap"><input class="weight" inputmode="decimal" type="number" min="0" step="0.5" placeholder="—" value="${esc(w)}" data-weight="${di}-${ei}-${si}"><span class="kg">kg</span></div><button class="removeSet" data-remove="${di}-${ei}-${si}" aria-label="Remove set">×</button></div>`).join("")}<button class="addset" data-add="${key}">+ Add set</button>${prev.length?`<div class="previous">Previous cycle: ${prev.map(x=>esc(x)+" kg").join(" · ")}</div>`:""}</div></div>`}).join("")}${d.note?`<div class="note">${esc(d.note)}</div>`:""}<button class="completebtn ${state.completed[di]?"done":""}" data-complete="${di}">${state.completed[di]?"Completed ✓":"Mark Day Complete"}</button></div>`;day.querySelector(".dayhead").onclick=()=>{state.opened=state.opened===di?-1:di;save();render()};days.appendChild(day)});
 document.querySelectorAll("[data-exercise]").forEach(sel=>sel.onchange=()=>{const[di,ei]=sel.dataset.exercise.split("-").map(Number);if(sel.value==="__custom__"){const name=prompt("Exercise name");if(name&&name.trim())loadExercise(di,ei,name.trim());}else loadExercise(di,ei,sel.value);render()});
 document.querySelectorAll("[data-guide]").forEach(b=>b.onclick=()=>{state.guideOpen=state.guideOpen===b.dataset.guide?null:b.dataset.guide;save();render()});document.querySelectorAll("[data-check]").forEach(el=>el.onclick=()=>{const[di,ei]=el.dataset.check.split("-").map(Number);state.ex[di][ei]=!state.ex[di][ei];save();render()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{state.weightOpen=state.weightOpen===b.dataset.toggle?null:b.dataset.toggle;save();render()});document.querySelectorAll("[data-rep]").forEach(inp=>{inp.oninput=()=>{const[di,ei,si]=inp.dataset.rep.split("-").map(Number);state.reps[di][ei][si]=inp.value;rememberCurrent(di,ei);save()}});document.querySelectorAll("[data-weight]").forEach(inp=>{inp.oninput=()=>{const[di,ei,si]=inp.dataset.weight.split("-").map(Number);state.weights[di][ei][si]=inp.value;rememberCurrent(di,ei);save()}});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const[di,ei]=b.dataset.add.split("-").map(Number);state.weights[di][ei].push("");state.reps[di][ei].push("");rememberCurrent(di,ei);save();render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const[di,ei,si]=b.dataset.remove.split("-").map(Number);if(state.weights[di][ei].length>1){state.weights[di][ei].splice(si,1);state.reps[di][ei].splice(si,1)}else{state.weights[di][ei][0]="";state.reps[di][ei][0]=""}rememberCurrent(di,ei);save();render()});document.querySelectorAll("[data-complete]").forEach(btn=>btn.onclick=()=>{const di=+btn.dataset.complete;state.completed[di]=!state.completed[di];if(state.completed[di]){state.opened=state.completed.findIndex(x=>!x);if(state.opened<0){state.history=(state.history||0)+1;celebrate.classList.add("show")}}else state.opened=di;save();render()})}
function newCycle(){state.previousWeights=JSON.parse(JSON.stringify(state.weights));state.previousReps=JSON.parse(JSON.stringify(state.reps));state.weights=JSON.parse(JSON.stringify(state.previousWeights));state.reps=JSON.parse(JSON.stringify(state.previousReps));state.cycle+=1;state.completed=[false,false,false,false,false];state.ex=plan.map(d=>d.exercises.map(()=>false));state.opened=0;state.weightOpen=null;state.guideOpen=null;save();celebrate.classList.remove("show");render()}goAgainBtn.onclick=()=>{if(state.completed.every(Boolean))newCycle();else{const n=state.completed.findIndex(x=>!x);state.opened=n<0?0:n;save();render();document.querySelectorAll(".day")[state.opened]?.scrollIntoView({behavior:"smooth",block:"center"})}};celebrateGo.onclick=newCycle;undoBtn.onclick=()=>{for(let i=4;i>=0;i--)if(state.completed[i]){state.completed[i]=false;state.opened=i;save();render();return}};render();
</script></body></html>
